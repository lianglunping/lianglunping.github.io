name: RPS portable runtime acquisition
on:
  push:
    branches: [build/rps-portable-runtime-20261016]
    paths:
      - '.github/scripts/rps_acquire_runtime.py'
      - '.github/scripts/rps_acquire_macos.py'
      - '.github/workflows/rps-portable-runtime.yml'
permissions:
  contents: read
concurrency:
  group: rps-portable-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare build-time wheel tag parser
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --target .rps-build-packages packaging==25.0
      - name: Source-build static-linked Tracy and acquire native macOS runtime
        shell: bash
        env:
          PYTHONPATH: .rps-build-packages
        run: |
          python -B .github/scripts/rps_acquire_macos.py --target macos-arm64
      - name: Retain payload or failure evidence, never deploy a site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rps-runtime-macos-arm64-${{ github.run_id }}
          path: rps-runtime-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
